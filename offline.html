<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Offline — ARCIRCLE PAD</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#04060a">
<style>
:root{color-scheme:dark;}
body{margin:0;min-height:100vh;min-height:100svh;display:grid;place-items:center;padding:24px 16px;background:#04060a;color:#eef3f7;
  font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif;text-align:center;}
main{max-width:420px;}
img{width:96px;height:96px;border-radius:24px;box-shadow:0 0 40px rgba(63,155,255,.25);}
h1{font-size:1.5rem;margin:20px 0 8px;}
p{color:rgba(222,233,244,.64);margin:0 0 22px;}
button{padding:12px 22px;border:0;border-radius:13px;font:700 .95rem system-ui,sans-serif;color:#03110a;cursor:pointer;
  background:linear-gradient(90deg,#3f9bff,#35d8d0,#39ff88);}
</style>
</head>
<body>
<main>
  <img src="/images/icon-192.png" alt="">
  <h1>You're offline</h1>
  <p>ARCIRCLE PAD reads everything live from Circle's Arc, so it needs a connection. Check your network and try again.</p>
  <button type="button" onclick="location.reload()">Try again</button>
</main>
</body>
</html>
